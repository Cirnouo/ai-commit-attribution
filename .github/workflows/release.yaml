name: Release

on:
    push:
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'
            - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        name: Verify release
        if: github.event.created && !github.event.deleted && !github.event.forced
        uses: ./.github/workflows/ci.yaml
        permissions:
            contents: read

    publish:
        name: Publish release
        needs: verify
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            PNPM_CONFIG_IGNORE_PNPMFILE: "true"
            PNPM_CONFIG_CONFIG_DEPENDENCIES: "{}"
        steps:
            -   name: Check out the verified commit and full history
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    fetch-depth: 0
                    ref: ${{ github.sha }}
                    persist-credentials: false
            -   name: Set up pnpm
                uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
                with:
                    version: 12.4.2
            -   name: Set up Node.js
                uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                with:
                    node-version: 24.21.0
                    cache: pnpm
            -   name: Install dependencies after the security and quality gates
                run: pnpm install --frozen-lockfile
            -   name: Validate, generate notes, and publish the release
                run: node tooling/release.ts
                env:
                    GH_TOKEN: ${{ github.token }}
